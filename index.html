    <!-- Critical Instant-Boot App Shell Screen (0ms white flash on mobile PWA launch) -->

        <div style="color:#64748B;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;">Income Allocation Engine</div>
        <div style="margin-top:28px;width:110px;height:3px;background:rgba(255,255,255,0.08);border-radius:9999px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;height:100%;width:40%;background:#00A896;border-radius:9999px;animation:pwaLoading 1.2s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes pwaPulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.18); opacity: 0.75; }
          }
          @keyframes pwaLoading {
            0% { left: -40%; width: 30%; }
            50% { left: 30%; width: 60%; }
            100% { left: 100%; width: 40%; }
          }
        </style>
      </div>
    </div>

    <!-- Instant Service Worker Bootstrapper -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
        const isLocalhost = Boolean(
          window.location.hostname === 'localhost' ||
          window.location.hostname === '[::1]' ||
          window.location.hostname.match(/^127(?:\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){3}$/)
        );

        if (isLocalhost) {
          navigator.serviceWorker.ready.then((registration) => {
            registration.unregister();
          }).catch(() => {});
        } else {
          // Register immediately on script execution for sub-second startup
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => {
              if (reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
              reg.update();
            })
            .catch(() => {});
        }
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
